[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: -100
max_temp: 130

[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0

[heater_fan nozzle_cooling_fan]
pin: PC7

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3900430014504B5735313920-if00
# serial: /dev/ttyAMA0
# restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 650
max_accel: 3400
# max_z_velocity: 5
# max_z_accel: 100
minimum_cruise_ratio: 0.5
max_z_velocity: 40 #ran 40 for 1 year without any problems after belt driven mod, before it was 5.0
square_corner_velocity: 5.0
max_z_accel: 500 #ran 150 for an year without any issues trying to push it no

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 103.2
shaper_type_y: mzv
shaper_freq_y: 33.8
shaper_type_z: 3hump_ei
shaper_freq_z: 48.0

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>


######################################################################
#  BigTreeTech TFT TouchScreen emulated 12864 mode
######################################################################

[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 # status led, Virtual MISO
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

# [bed_mesh]
# speed: 120
# horizontal_move_z: 5
# mesh_min: 10, 10
# mesh_max: 190, 220
# probe_count: 5,5

[bed_mesh]
speed: 120
mesh_min: 25,30         # Need to handle head distance with cr-touch (bl_touch)
mesh_max: 210,190       # Max probe range
probe_count: 5,5
fade_start: 1
fade_end: 10
fade_target: 0
algorithm: bicubic

[bed_screws]
screw1:30,25
screw1_name:1
screw2:200,25
screw2_name:2
screw3:200,195
screw3_name:3
screw4:30,195
screw4_name:4

[screws_tilt_adjust]
screw1: 74, 35
screw1_name: front left screw
screw2: 214, 35
screw2_name: front right screw
screw3: 214, 205
screw3_name: rear right screw
screw4: 74, 205
screw4_name: rear left screw
horizontal_move_z: 10
speed: 200
screw_thread: CW-M4 # Use CW for Clockwise and CCW for Counter Clockwise


[display_status]


[adxl345]
cs_pin: rpi:None
# rate: 800 # for continuous monitoring/testing

[resonance_tester]
accel_chip: adxl345
probe_points:
    112, 110, 20  #around in the middle
max_freq_z: 100 # 100 by default
accel_per_hz: 12.5 # 12.5 by default
sweeping_accel_z: 50 # 50 by default
accel_chip_z: adxl345  # no default; if unset, must be provided in CHIPS=<..> parameter


[gcode_macro change_tune]
description: Change filament tune
gcode:
    M300 S440 P200
    M300 S660 P250
    M300 S880 P300

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
      {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}
  
[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}

# [include moonraker_obico_macros.cfg]

[idle_timeout]
timeout: 4000 #600 #in seconds
gcode:
  _KM_IDLE_TIMEOUT
  M84
  TURN_OFF_HEATERS
  STATUS

